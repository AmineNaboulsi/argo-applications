apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "testdb"
  namespace: "client-apps"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: "testdb"
  template:
    metadata:
      labels:
        app: "testdb"
    spec:
      containers:
      - name: "testdb"
        image: "mysql:8.0"
        ports:
        - containerPort: 3306
        env:
        - name: "MYSQL_DATABASE"
        - name: "MYSQL_USER"
          value: "testuser"
        - name: "MYSQL_PASSWORD"
          value: "testpass"
        - name: "MYSQL_ROOT_PASSWORD"
          value: "testpass"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "testdb-svc"
  namespace: "client-apps"
spec:
  type: "NodePort"
  selector:
    app: "testdb"
  ports:
  - port: 3306
    targetPort: 3306
    nodePort: 31301
