apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "demoappv1"
  namespace: "client-apps"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: "demoappv1"
  template:
    metadata:
      labels:
        app: "demoappv1"
    spec:
      containers:
      - name: "demoappv1"
        image: "registry.gitlab.com/home-server5364202/demo:latest"
        ports:
        - containerPort: 80
      imagePullSecrets:
      - name: "pull-secret-demoappv1"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "demoappv1-svc"
  namespace: "client-apps"
spec:
  type: "ClusterIP"
  selector:
    app: "demoappv1"
  ports:
  - port: 80
    targetPort: 8010
---
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: "demoappv1-ingress"
  namespace: "client-apps"
  annotations:
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: "/"
spec:
  rules:
  - host: "demoappv1-gvx4cq.naboulsiamine.com"
    http:
      paths:
      - path: "/"
        pathType: "Prefix"
        backend:
          service:
            name: "demoappv1-svc"
            port:
              number: 80
  tls:
  - hosts:
    - "demoappv1-gvx4cq.naboulsiamine.com"
    secretName: "demoappv1-tls"
