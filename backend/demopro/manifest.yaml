apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "demopro"
  namespace: "client-apps"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: "demopro"
  template:
    metadata:
      labels:
        app: "demopro"
    spec:
      containers:
      - name: "demopro"
        image: "registry.gitlab.com/home-server5364202/demo:latest"
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: "demopro-config"
        - secretRef:
            name: "demopro-env-secret"
      imagePullSecrets:
      - name: "pull-secret-demopro"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "demopro-svc"
  namespace: "client-apps"
spec:
  type: "ClusterIP"
  selector:
    app: "demopro"
  ports:
  - port: 80
    targetPort: 8010
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "demopro-config"
  namespace: "client-apps"
---
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: "demopro-ingress"
  namespace: "client-apps"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: "/"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: "nginx"
  rules:
  - host: "demopro-e87hrl.naboulsiamine.com"
    http:
      paths:
      - path: "/"
        pathType: "Prefix"
        backend:
          service:
            name: "demopro-svc"
            port:
              number: 80
  tls:
  - hosts:
    - "demopro-e87hrl.naboulsiamine.com"
    secretName: "demopro-tls"
