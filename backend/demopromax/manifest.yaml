apiVersion: "apps/v1"
kind: "Deployment"
metadata:
  name: "demopromax"
  namespace: "client-apps"
spec:
  replicas: 1
  revisionHistoryLimit: 3
  selector:
    matchLabels:
      app: "demopromax"
  template:
    metadata:
      labels:
        app: "demopromax"
    spec:
      containers:
      - name: "demopromax"
        image: "registry.gitlab.com/home-server5364202/demo:latest"
        ports:
        - containerPort: 80
        envFrom:
        - configMapRef:
            name: "demopromax-config"
        - secretRef:
            name: "demopromax-env-secret"
      imagePullSecrets:
      - name: "pull-secret-demopromax"
---
apiVersion: "v1"
kind: "Service"
metadata:
  name: "demopromax-svc"
  namespace: "client-apps"
spec:
  type: "ClusterIP"
  selector:
    app: "demopromax"
  ports:
  - port: 80
    targetPort: 8010
---
apiVersion: "v1"
kind: "ConfigMap"
metadata:
  name: "demopromax-config"
  namespace: "client-apps"
---
apiVersion: "networking.k8s.io/v1"
kind: "Ingress"
metadata:
  name: "demopromax-ingress"
  namespace: "client-apps"
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
    nginx.ingress.kubernetes.io/rewrite-target: "/"
    nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
spec:
  ingressClassName: "nginx"
  rules:
  - host: "demopromax-iicd7f.naboulsiamine.com"
    http:
      paths:
      - path: "/"
        pathType: "Prefix"
        backend:
          service:
            name: "demopromax-svc"
            port:
              number: 80
  tls:
  - hosts:
    - "demopromax-iicd7f.naboulsiamine.com"
    secretName: "demopromax-tls"
